[package]
name = "server"
version = "1.4.0"
edition = "2024"
rust-version = "1.91.0"

[lints.clippy]
pedantic = "warn"

[dependencies]

axum = { version = "0.8.4", features = ["macros", "multipart"] }
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "fs", "cors"] }
http = "1.2.0"

tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
base64 = "0.22.1"

shared = { path = "../shared" }
trace = "0.1.7"

diesel = { version = "2.2.10", features = [
    "postgres",
    "uuid",
    "chrono",
    "r2d2",
    "serde_json",
] }
chrono = { version = "0.4.41", features = ["serde"] }
sha2 = "0.10.9"
validator = { version = "0.20.0", features = ["derive"] }
tower-cookies = "0.11.0"
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"] }
regex = "1.11.1"
ulid = { version = "1.2.1", features = ["serde", "postgres"] }
vaultrs = "0.8.0"
dotenvy = "0.15.7"
utoipa = { version = "5.3.1", features = ["axum_extras", "ulid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
image = "0.25.6"
webp = "0.3.0"
thiserror = "2.0.16"
resend-rs = { version = "0.22.0", default-features = false, features = [
    "native-tls",
] }
rand = "0.9.2"
argon2 = "0.5"
diesel_migrations = "2.3.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
socketioxide = { version = "0.18.0", features = ["state", "extensions"] }
x25519-dalek = "2.0.1"
aes-gcm = "0.10.3"

[dev-dependencies]
mockall = "0.14"
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }
axum-test = "20.0.0"
serial_test = "3.2.0"
