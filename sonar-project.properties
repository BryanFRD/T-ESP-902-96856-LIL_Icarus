# SonarQube Project Configuration
sonar.projectKey=icarus_app_51d7c32a-ae1e-4759-ba53-3add546ddf2a
sonar.projectName=Icarus App
sonar.projectVersion=1.0

# Source code location
sonar.sources=server/src,agent/src,shared/src
sonar.sourceEncoding=UTF-8

# Test locations
sonar.tests=server/src,agent/src,shared/src
sonar.test.inclusions=**/*test*.rs,**/tests/**/*.rs

# Coverage reports (Cobertura XML format)
sonar.coverageReportPaths=coverage/cobertura.xml

# Exclude generated files
sonar.exclusions=**/target/**,**/schema.rs,**/models/schema.rs

# Language
sonar.language=rust
sonar.qualitygate.wait=true

# Clippy configuration
sonar.rust.clippy.skip=true
sonar.rust.clippy.reportPaths=reports/clippy-report.json
