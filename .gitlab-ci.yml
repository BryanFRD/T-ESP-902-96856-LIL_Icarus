stages:
  - test
  - build
  - deploy

🔎_check:
  image: rust:1.87
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running cargo check..."
    - cargo check

📏_clippy:
  image: rust:1.87
  stage: test
  needs:
    - job: 🔎_check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running cargo clippy ..."
    - cargo clippy -- -W clippy::pedantic -Dwarnings

🧪_test:
  image: rust:1.87
  stage: test
  needs:
    - job: 🔎_check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running tests..."
    - cargo test

🛠_build:
  image: quay.io/buildah/stable:latest
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  script:
    - echo "Building Docker image with Buildah..."
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        TAG="-t app:latest -t app-dev:latest"
      else
        TAG="-t app-dev:latest"
      fi
    - buildah bud $TAG .

✈_deploy_dev:
  image: quay.io/buildah/stable:latest
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: manual
  script:
    - echo "Pushing dev image to registry..."
    - echo $DOCKER_REGISTRY_PASSWORD_DEV | buildah login --username $DOCKER_REGISTRY_USERNAME_DEV --password-stdin $DOCKER_REGISTRY
    - buildah tag app-dev:latest $DOCKER_REGISTRY/app-dev:latest
    - buildah push $DOCKER_REGISTRY/app-dev:latest
  allow_failure: true

✈_deploy_prod:
  image: quay.io/buildah/stable:latest
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  script:
    - echo "Pushing production image to registry..."
    - echo $DOCKER_REGISTRY_PASSWORD_PROD | buildah login --username $DOCKER_REGISTRY_USERNAME_PROD --password-stdin $DOCKER_REGISTRY
    - buildah tag app:latest $DOCKER_REGISTRY/app:latest
    - buildah push $DOCKER_REGISTRY/app:latest
