stages:
  - test
  - build
  - deploy
  - cleanup

🔎_check:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running cargo check..."
    - cargo check

📏_clippy:
  stage: test
  needs:
    - job: 🔎_check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running cargo clippy ..."
    - cargo clippy -- -W clippy::pedantic -Dwarnings

🧪_test:
  stage: test
  needs:
    - job: 🔎_check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running tests..."
    - cargo test

🛠_build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success 
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  script:
    - echo "Building Docker image..."
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        TAG="-t app:latest -t app-dev:latest"
      else
        TAG="-t app-dev:latest"
      fi
    - docker build $TAG .

✈_deploy_dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: manual
  script:
    - echo "Deploying to dev..."
    - echo $DOCKER_REGISTRY_PASSWORD_DEV | docker login --username $DOCKER_REGISTRY_USERNAME_DEV --password-stdin $DOCKER_REGISTRY
    - docker tag app-dev:latest $DOCKER_REGISTRY/app-dev:latest
    - docker push $DOCKER_REGISTRY/app-dev:latest
    - export VAULT_ADDR=http://localhost:8200
    - export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
    - vault login $VAULT_TOKEN > /dev/null 2>&1
    - cd server
    - export DATABASE_URL=$(vault kv get -field=DATABASE_URL_CI secret/env/dev/app)
    - diesel migration run --database-url $DATABASE_URL
    - /home/antoine/dockers/update.sh
  allow_failure: true

✈_deploy_prod:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  script:
    - echo "Deploying to production..."
    - echo $DOCKER_REGISTRY_PASSWORD_PROD | docker login --username $DOCKER_REGISTRY_USERNAME_PROD --password-stdin $DOCKER_REGISTRY
    - docker tag app:latest $DOCKER_REGISTRY/app:latest
    - docker push $DOCKER_REGISTRY/app:latest
    - export VAULT_ADDR=http://localhost:8200
    - export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
    - vault login $VAULT_TOKEN > /dev/null 2>&1
    - cd server
    - export DATABASE_URL=$(vault kv get -field=DATABASE_URL_CI secret/env/prod/app)
    - diesel migration run --database-url $DATABASE_URL
    - /home/antoine/dockers/update.sh

🧹_cleanup:
  stage: cleanup
  when: always
  script:
    - echo "Cleaning up..."
    - rm -rf target
    - docker logout $DOCKER_REGISTRY
  allow_failure: true
