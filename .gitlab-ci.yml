workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - notify
  - test
  - release
  - deploy

# ================= NOTIFY =================

🔔_notify_discord_reviewer:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache jq curl
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_IID'
      when: always
  allow_failure: true
  script:
    - echo "Notifying Discord reviewer..."
    - |
      echo "CI_PROJECT_ID=$CI_PROJECT_ID"
      echo "CI_MERGE_REQUEST_IID=$CI_MERGE_REQUEST_IID"

      GITLAB_URL="${CI_SERVER_URL}"
      MR_INFO=$(curl --silent --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "${GITLAB_URL}/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID")


      if [ -z "$MR_INFO" ] || [ "$MR_INFO" = "null" ]; then
        echo "Failed to fetch MR info from GitLab API. Response: $MR_INFO"
        exit 0
      fi

      REVIEWERS_EXIST=$(echo "$MR_INFO" | jq -r '.reviewers')
      if [ "$REVIEWERS_EXIST" = "null" ] || [ "$REVIEWERS_EXIST" = "[]" ]; then
        echo "No reviewers in this MR, exiting."
        exit 0
      fi

      REVIEWER_IDS=$(echo "$MR_INFO" | jq -r '.reviewers[].username')

      if [ -z "$REVIEWER_IDS" ]; then
        echo "No reviewers in this MR, exiting."
        exit 0
      fi

      echo "Reviewers: $REVIEWER_IDS"

      # Map GitLab usernames to Discord IDs
      REVIEWER_MAPPING='{
        "Antoine": "260109480455307264",
        "azoulux": "477253430033907722",
        "Bryan": "210742118669484034",
        "corentincollery": "684002215139999774",
        "Natchi59": "483189540622958593",
        "Reweilk": "924211405866037278"
      }'

      for REVIEWER in $REVIEWER_IDS; do
        DISCORD_ID=$(echo "$REVIEWER_MAPPING" | jq -r --arg r "$REVIEWER" '.[$r]')
        if [ "$DISCORD_ID" = "null" ] || [ -z "$DISCORD_ID" ]; then
          echo "Reviewer $REVIEWER not found in mapping, skipping notification."
          continue
        fi

        curl -X POST -H "Content-Type: application/json" -d "{
          \"content\": \"<@$DISCORD_ID> you have a new merge request to review !\",
          \"embeds\": [{
            \"title\": \"👀 Review asked\",
            \"description\": \"**${CI_MERGE_REQUEST_TITLE}** by ${GITLAB_USER_NAME}\n<${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}>\",
            \"color\": 5814783
          }]
        }" $DISCORD_REVIEW_WEBHOOK
      done

# ================= TEST =================

.pnpm_setup:
  image: node:22-alpine
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    HUSKY: '0'
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile
  cache:
    - key: pnpm-$CI_COMMIT_REF_SLUG
      paths:
        - .pnpm-store/
      policy: pull-push
    - key: pnpm-main
      paths:
        - .pnpm-store/
      policy: pull
  rules:
    - when: always

📏_lint:
  extends: .pnpm_setup
  stage: test
  script:
    - pnpm run lint --max-warnings 0

📝_type_check:
  extends: .pnpm_setup
  stage: test
  script:
    - pnpm run type:check

🎨_format_check:
  extends: .pnpm_setup
  stage: test
  script:
    - pnpm run format:check

🧪_test:
  extends: .pnpm_setup
  image: node:22
  stage: test
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install --with-deps
  script:
    - pnpm run test:run --coverage
  artifacts:
    paths:
      - coverage
    expire_in: 1 day

🔍_sonar_scan:
  stage: test
  image: sonarsource/sonar-scanner-cli:11
  needs:
    - job: 🧪_test
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    - key: sonar-$CI_COMMIT_REF_SLUG
      policy: pull-push
      paths:
        - "${SONAR_USER_HOME}/cache"
  script:
    - echo "Running SonarQube scan..."
    - sonar-scanner
        -Dsonar.projectKey=${SONAR_PROJECT_KEY}
        -Dsonar.sources=src
        -Dsonar.host.url=${SONAR_HOST_URL}
        -Dsonar.token=${SONAR_TOKEN}
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        -Dsonar.exclusions=src/index.css,**/*.test.*,**/*.spec.*,**/*.stories.*
        -Dsonar.qualitygate.wait=true
  allow_failure: true

# ================= RELEASE =================

🎉_ferrflow_release:
  stage: release
  image: ghcr.io/ferrflow-org/ferrflow:2.12.3
  variables:
    HUSKY: '0'
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache jq
  script:
    - ferrflow --version
    - ferrflow release
    - VERSION=$(jq -r '.version' package.json)
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    paths:
      - CHANGELOG.md
      - package.json
    reports:
      dotenv: release.env
  rules:
    - when: on_success

# ================= DEPLOY =================

✈_deploy_dev:
  stage: deploy
  image: quay.io/buildah/stable:latest
  needs:
    - job: 🎉_ferrflow_release
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - echo "Building and deploying DEV web image ${VERSION}..."
    - buildah build --build-arg BUILD_MODE=development --storage-driver=vfs -t web-dev:${VERSION} -t web-dev:latest .
    - echo "$DOCKER_REGISTRY_PASSWORD_DEV" | buildah login --storage-driver=vfs --username "$DOCKER_REGISTRY_USERNAME_DEV" --password-stdin $DOCKER_REGISTRY
    - buildah tag --storage-driver=vfs web-dev:${VERSION} $DOCKER_REGISTRY/web-dev:${VERSION}
    - buildah tag --storage-driver=vfs web-dev:latest $DOCKER_REGISTRY/web-dev:latest
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/web-dev:${VERSION}
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/web-dev:latest

📝_deploy_prod:
  stage: deploy
  image: quay.io/buildah/stable:latest
  needs:
    - job: 🎉_ferrflow_release
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
      when: on_success
  script:
    - echo "Building and deploying PRODUCTION web image with ferrflow version..."
    - echo "Version -> $VERSION"
    - buildah build --storage-driver=vfs -t $DOCKER_REGISTRY/web:$VERSION -t $DOCKER_REGISTRY/web:latest .
    - echo "$DOCKER_REGISTRY_PASSWORD_PROD" | buildah login --storage-driver=vfs --username "$DOCKER_REGISTRY_USERNAME_PROD" --password-stdin $DOCKER_REGISTRY
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/web:$VERSION
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/web:latest
