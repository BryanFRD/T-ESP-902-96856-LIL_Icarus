stages:
  - build
  - test
  - deploy
  - cleanup

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""
  CARGO_HOME: /cache/cargo
  CARGO_TARGET_DIR: /cache/target

services:
  - name: docker:dind
    alias: docker

build:
  stage: build
  image: docker:latest
  tags: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - echo "Building Docker image..."
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        TAGS="-t app:latest -t app-dev:latest"
      else
        TAGS="-t app-dev:latest"
      fi
    - docker build $TAGS .

test:
  stage: test
  image: rust:1.87-alpine
  tags: [ci, rust]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Running tests..."
    - cargo test
  needs:
    - job: build

deploy_dev:
  stage: deploy
  image: docker:latest
  tags: [ci]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: manual
  needs:
    - job: test
      optional: true
  script:
    - echo "Deploying to dev..."
    - echo $DOCKER_REGISTRY_PASSWORD_DEV | docker login --username $DOCKER_REGISTRY_USERNAME_DEV --password-stdin $DOCKER_REGISTRY
    - docker tag app-dev:latest $DOCKER_REGISTRY/app-dev:latest
    - docker push $DOCKER_REGISTRY/app-dev:latest
    - export VAULT_ADDR=http://localhost:8200
    - export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
    - vault login $VAULT_TOKEN > /dev/null 2>&1
    - cd server
    - export DATABASE_URL=$(vault kv get -field=DATABASE_URL_CI secret/env/dev/app)
    - diesel migration run --database-url $DATABASE_URL
    - ~/dockers/update.sh
  allow_failure: true

deploy_prod:
  stage: deploy
  image: docker:latest
  tags: [ci]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  needs:
    - job: test
  script:
    - echo "Deploying to production..."
    - echo $DOCKER_REGISTRY_PASSWORD_PROD | docker login --username $DOCKER_REGISTRY_USERNAME_PROD --password-stdin $DOCKER_REGISTRY
    - docker tag app:latest $DOCKER_REGISTRY/app:latest
    - docker push $DOCKER_REGISTRY/app:latest
    - export VAULT_ADDR=http://localhost:8200
    - export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
    - vault login $VAULT_TOKEN > /dev/null 2>&1
    - cd server
    - export DATABASE_URL=$(vault kv get -field=DATABASE_URL_CI secret/env/prod/app)
    - diesel migration run --database-url $DATABASE_URL
    - ~/dockers/update.sh
