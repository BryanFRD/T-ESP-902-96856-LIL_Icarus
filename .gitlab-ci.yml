stages:
  - test
  - sonar
  - build
  - deploy

🔎_check:
  image: rust:1.87
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running cargo check..."
    - cargo check

📏_clippy:
  image: rust:1.87
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "Running cargo clippy ..."
    - rustup component add clippy
    - mkdir -p reports
    - cargo clippy --workspace --all-features --message-format=json -- -W clippy::pedantic -Dwarnings > reports/clippy-report.json || true
    - cargo clippy --workspace --all-features -- -W clippy::pedantic -Dwarnings
  artifacts:
    paths:
      - reports/clippy-report.json
    expire_in: 30 days

🧪_test:
  image: rust:1.87
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  before_script:
    - echo "Installing test dependencies..."
    - rustup component add llvm-tools-preview
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall --no-confirm cargo-llvm-cov
    - apt-get update && apt-get install -y python3-pip
    - pip3 install lcov_cobertura --break-system-packages
  script:
    - echo "Running tests with coverage..."
    - mkdir -p coverage
    - |
      if cargo llvm-cov --all-features --workspace --lcov --output-path coverage/lcov.info 2>&1 | tee coverage/llvm-cov.log; then
        echo "Coverage report generated successfully"
        echo "Converting LCOV to Cobertura XML..."
        lcov_cobertura coverage/lcov.info --output coverage/cobertura.xml
      else
        echo "No tests found or coverage generation failed"
        rm -f coverage/lcov.info
      fi
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    paths:
      - coverage/
    expire_in: 30 days

📊_sonar:
  image: sonarsource/sonar-scanner-cli:latest
  stage: sonar
  dependencies:
    - 🧪_test
    - 📏_clippy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: 0
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
  allow_failure: true

🛠_build:
  image: quay.io/buildah/stable:latest
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  script:
    - echo "Building Docker images with Buildah..."
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        # Build both tags for main branch
        buildah bud --storage-driver=vfs -t app:latest -t app-dev:latest .
        # Export both images as tar
        buildah push --storage-driver=vfs app:latest oci-archive:app-latest.tar
        buildah push --storage-driver=vfs app-dev:latest oci-archive:app-dev-latest.tar
      else
        # Build only dev tag for merge requests
        buildah bud --storage-driver=vfs -t app-dev:latest .
        buildah push --storage-driver=vfs app-dev:latest oci-archive:app-dev-latest.tar
      fi
  artifacts:
    paths:
      - app-latest.tar
      - app-dev-latest.tar
    expire_in: 1 hour

✈_deploy_dev:
  image: quay.io/buildah/stable:latest
  stage: deploy
  dependencies:
    - 🛠_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: manual
  script:
    - echo "Importing and pushing dev image..."
    # Import the image from tar
    - buildah pull --storage-driver=vfs oci-archive:app-dev-latest.tar
    # Get the imported image ID
    - IMAGE_ID=$(buildah images --storage-driver=vfs --format "{{.ID}}" | head -n 1)
    # Tag the image
    - buildah tag --storage-driver=vfs $IMAGE_ID app-dev:latest
    # Push to registry
    - echo $DOCKER_REGISTRY_PASSWORD_DEV | buildah login --storage-driver=vfs --username $DOCKER_REGISTRY_USERNAME_DEV --password-stdin $DOCKER_REGISTRY
    - buildah tag --storage-driver=vfs app-dev:latest $DOCKER_REGISTRY/app-dev:latest
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/app-dev:latest
  allow_failure: true

✈_deploy_prod:
  image: quay.io/buildah/stable:latest
  stage: deploy
  dependencies:
    - 🛠_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  script:
    - echo "Importing and pushing production image..."
    # Import the image from tar
    - buildah pull --storage-driver=vfs oci-archive:app-latest.tar
    # Get the imported image ID
    - IMAGE_ID=$(buildah images --storage-driver=vfs --format "{{.ID}}" | head -n 1)
    # Tag the image
    - buildah tag --storage-driver=vfs $IMAGE_ID app:latest
    # Push to registry
    - echo $DOCKER_REGISTRY_PASSWORD_PROD | buildah login --storage-driver=vfs --username $DOCKER_REGISTRY_USERNAME_PROD --password-stdin $DOCKER_REGISTRY
    - buildah tag --storage-driver=vfs app:latest $DOCKER_REGISTRY/app:latest
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/app:latest
