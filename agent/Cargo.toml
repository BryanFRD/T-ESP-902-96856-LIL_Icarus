[package]
name = "agent"
version = "1.6.0"
edition = "2024"

[dependencies]
x25519-dalek = "2.0.1"
shared = { path = "../shared" }
aes-gcm = "0.10.3"
rand = "0.9.1"
thiserror = "2.0.16"
crossbeam = "0.8"
sysinfo = "0.38"
which = "8.0"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
