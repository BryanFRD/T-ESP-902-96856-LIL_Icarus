workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\)/'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never

stages:
  - notify
  - test
  - sonar
  - release
  - build
  - deploy
  - mirror

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

# ================= NOTIFY =================

🔔_notify_discord_reviewer:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache jq curl
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_IID'
      when: always
  allow_failure: true
  script:
    - echo "Notifying Discord reviewer..."
    - |
      echo "CI_PROJECT_ID=$CI_PROJECT_ID"
      echo "CI_MERGE_REQUEST_IID=$CI_MERGE_REQUEST_IID"

      GITLAB_URL="${CI_SERVER_URL}"

      MR_INFO=$(curl -s --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" "${GITLAB_URL}/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID")

      echo "MR_INFO: $MR_INFO"

      REVIEWER_IDS=$(echo "$MR_INFO" | jq -r '.reviewers // [] | .[].username' 2>/dev/null || echo "")

      if [ -z "$REVIEWER_IDS" ]; then
        echo "No reviewers in this MR, exiting."
        exit 0
      fi

      echo "Reviewers: $REVIEWER_IDS"

      # === Mapping reviewers → Discord IDs ===
      REVIEWER_MAPPING='{
        "Antoine": "260109480455307264",
        "azoulux": "477253430033907722",
        "Bryan": "210742118669484034",
        "corentincollery": "684002215139999774",
        "Natchi59": "213390185528819713",
        "Reweilk ": "924211405866037278",
        "Edwin": "394941518634549248"
      }'

      for REVIEWER in $REVIEWER_IDS; do
        DISCORD_ID=$(echo "$REVIEWER_MAPPING" | jq -r --arg r "$REVIEWER" '.[$r]')
        if [ "$DISCORD_ID" = "null" ] || [ -z "$DISCORD_ID" ]; then
          echo "Reviewer $REVIEWER not found in mapping, skipping notification."
          continue
        fi

        curl -X POST -H "Content-Type: application/json" -d "{
          \"content\": \"<@$DISCORD_ID> you have a new merge request to review !\",
          \"embeds\": [{
            \"title\": \"👀 Review asked\",
            \"description\": \"**${CI_MERGE_REQUEST_TITLE}** by ${GITLAB_USER_NAME}\n<${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}>\",
            \"color\": 5814783
          }]
        }" $DISCORD_REVIEW_WEBHOOK
      done

# ================= TEST =================

🔎_check:
  image: rust:1.91
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  cache:
    - key: cargo-check-$CI_COMMIT_REF_SLUG
      paths:
        - target/debug/
        - .cargo/registry/
      policy: pull-push
    - key: cargo-check-main
      paths:
        - target/debug/
        - .cargo/registry/
      policy: pull
  script:
    - echo "Running cargo check..."
    - cargo check

📏_clippy:
  image: rust:1.91
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  cache:
    - key: cargo-clippy-$CI_COMMIT_REF_SLUG
      paths:
        - target/debug/
        - .cargo/registry/
      policy: pull-push
    - key: cargo-clippy-main
      paths:
        - target/debug/
        - .cargo/registry/
      policy: pull
  script:
    - echo "Running cargo clippy ..."
    - rustup component add clippy
    - mkdir -p reports
    - cargo clippy --workspace --all-features --message-format=json -- -W clippy::pedantic -Dwarnings > reports/clippy-report.json || true
    - cargo clippy --workspace --all-features -- -W clippy::pedantic -Dwarnings
  artifacts:
    paths:
      - reports/clippy-report.json
    expire_in: 30 days

🧪_test:
  image: rust:1.91
  stage: test
  services:
    - postgres:17
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    DATABASE_URL: postgres://testuser:testpass@postgres:5432/testdb
    CI_DATABASE: 'true'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  cache:
    - key: cargo-test-$CI_COMMIT_REF_SLUG
      paths:
        - target/debug/
        - .cargo/registry/
      policy: pull-push
    - key: cargo-test-main
      paths:
        - target/debug/
        - .cargo/registry/
      policy: pull
  before_script:
    - echo "Installing test dependencies..."
    - rustup component add llvm-tools-preview
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall --no-confirm cargo-llvm-cov
    - apt-get update && apt-get install -y python3
  script:
    - echo "Running tests with coverage..."
    - mkdir -p coverage
    - |
      if cargo llvm-cov --all-features -p server --bin server --lcov --output-path coverage/lcov.info 2>&1 | tee coverage/llvm-cov.log; then
        echo "LCOV coverage report generated successfully"
        
        # Validate LCOV file
        if [ ! -s coverage/lcov.info ]; then
          echo "Warning: LCOV file is empty, creating minimal coverage report"
          echo "TN:" > coverage/lcov.info
          echo "end_of_record" >> coverage/lcov.info
        fi
        
        echo "Converting LCOV to SonarQube Generic Coverage XML format..."
        python3 scripts/lcov_to_generic_coverage.py coverage/lcov.info coverage/generic-coverage.xml
        
        # Validate XML
        if [ ! -s coverage/generic-coverage.xml ]; then
          echo "Error: XML coverage report is empty"
          exit 1
        fi
      else
        echo "Coverage generation had issues, creating minimal report"
        mkdir -p coverage
        echo "TN:" > coverage/lcov.info
        echo "end_of_record" >> coverage/lcov.info
        python3 scripts/lcov_to_generic_coverage.py coverage/lcov.info coverage/generic-coverage.xml
      fi
  artifacts:
    paths:
      - coverage/
    expire_in: 30 days
  allow_failure: true

📊_sonar:
  image: sonarsource/sonar-scanner-cli:latest
  stage: sonar
  dependencies:
    - 🧪_test
    - 📏_clippy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: 0
  cache:
    key: '${CI_JOB_NAME}'
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.qualitygate.wait=true
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
  allow_failure: true

# ================= RELEASE =================

🎉_ferrflow_release:
  stage: release
  image:
    name: ghcr.io/ferrflow-org/ferrflow:2.22.1
  variables:
    GIT_DEPTH: 0
  script:
    - ferrflow --version
    - ferrflow release
    - VERSION=$(ferrflow version app)
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/ && $CI_PIPELINE_SOURCE != "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

# ================= BUILD =================

🛠_build:
  image: quay.io/buildah/stable:latest
  stage: build
  needs:
    - job: 🎉_ferrflow_release
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  script:
    - echo "Building Docker images with Buildah..."
    - |
      VERSION="${CI_COMMIT_TAG:-${VERSION:-latest}}"
      VERSION="${VERSION#v}"
      echo "Building version: $VERSION"
      if [ -n "$CI_COMMIT_TAG" ]; then
        buildah build --storage-driver=vfs -t app:$VERSION -t app:latest -t app-dev:latest .
        buildah push --storage-driver=vfs app:latest oci-archive:app-latest.tar
        buildah push --storage-driver=vfs app-dev:latest oci-archive:app-dev-latest.tar
      else
        buildah build --storage-driver=vfs -t app-dev:latest .
        buildah push --storage-driver=vfs app-dev:latest oci-archive:app-dev-latest.tar
      fi
  artifacts:
    paths:
      - app-*.tar
    expire_in: 1 hour

✈_deploy_dev:
  image: quay.io/buildah/stable:latest
  stage: deploy
  needs:
    - job: 🛠_build
      artifacts: true
    - job: 🎉_ferrflow_release
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
  script:
    - VERSION="${CI_COMMIT_TAG:-${VERSION:-latest}}"
    - VERSION="${VERSION#v}"
    - echo "Importing and pushing dev image ${VERSION}..."
    - buildah pull --storage-driver=vfs oci-archive:app-dev-latest.tar
    - IMAGE_ID=$(buildah images --storage-driver=vfs --format "{{.ID}}" | head -n 1)
    - buildah tag --storage-driver=vfs $IMAGE_ID app-dev:latest
    - echo $DOCKER_REGISTRY_PASSWORD_DEV | buildah login --storage-driver=vfs --username $DOCKER_REGISTRY_USERNAME_DEV --password-stdin $DOCKER_REGISTRY
    - buildah tag --storage-driver=vfs app-dev:latest $DOCKER_REGISTRY/app-dev:${VERSION}
    - buildah tag --storage-driver=vfs app-dev:latest $DOCKER_REGISTRY/app-dev:latest
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/app-dev:${VERSION}
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/app-dev:latest
  allow_failure: true

✈_deploy_prod:
  image: quay.io/buildah/stable:latest
  stage: deploy
  needs:
    - job: 🛠_build
      artifacts: true
    - job: 🎉_ferrflow_release
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
  script:
    - VERSION="${CI_COMMIT_TAG:-${VERSION:-latest}}"
    - VERSION="${VERSION#v}"
    - echo "Importing and pushing production image ${VERSION}..."
    - buildah pull --storage-driver=vfs oci-archive:app-latest.tar
    - IMAGE_ID=$(buildah images --storage-driver=vfs --format "{{.ID}}" | head -n 1)
    - buildah tag --storage-driver=vfs $IMAGE_ID app:latest
    - echo $DOCKER_REGISTRY_PASSWORD_PROD | buildah login --storage-driver=vfs --username $DOCKER_REGISTRY_USERNAME_PROD --password-stdin $DOCKER_REGISTRY
    - buildah tag --storage-driver=vfs app:latest $DOCKER_REGISTRY/app:${VERSION}
    - buildah tag --storage-driver=vfs app:latest $DOCKER_REGISTRY/app:latest
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/app:${VERSION}
    - buildah push --storage-driver=vfs $DOCKER_REGISTRY/app:latest

# ================= MIRROR TO GITHUB =================

🪞_mirror_to_github:
  image: alpine/git:latest
  stage: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  before_script:
    - apk add --no-cache git openssh-client git-subtree
    - mkdir -p ~/.ssh
    - echo "$GITHUB_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git config --global user.email "ci@icarus-cyber.fr"
    - git config --global user.name "GitLab CI"
  script:
    - echo "Mirroring all 4 projects to GitHub using git subtree..."
    - mkdir -p /tmp/merged_repo
    - cd /tmp/merged_repo
    - git config --global init.defaultBranch main
    - git clone git@github.com:EpitechMscProPromo2026/T-ESP-902-96856-LIL_Icarus.git . 2>/dev/null || git init
    - git config user.email "ci@icarus-cyber.fr"
    - git config user.name "GitLab CI"
    - git remote set-url origin git@github.com:EpitechMscProPromo2026/T-ESP-902-96856-LIL_Icarus.git 2>/dev/null || git remote add origin git@github.com:EpitechMscProPromo2026/T-ESP-902-96856-LIL_Icarus.git
    - git pull origin main || true
    - echo "Removing non-subtree directories and files..."
    - find . -maxdepth 1 -type d ! -name '.git' ! -name 'app' ! -name 'bruno' ! -name 'vitrine' ! -name 'web' -exec rm -rf {} + 2>/dev/null || true
    - find . -maxdepth 1 -type f ! -name '.gitmodules' ! -name '.gitignore' -delete 2>/dev/null || true
    - git add -A && git commit -m "Clean up non-subtree files" || true
    - |
      git subtree add --prefix=app https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/app.git main --squash 2>/dev/null || git subtree pull --prefix=app https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/app.git main --squash || true
      git subtree add --prefix=bruno https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/bruno.git main --squash 2>/dev/null || git subtree pull --prefix=bruno https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/bruno.git main --squash || true
      git subtree add --prefix=vitrine https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/vitrine.git main --squash 2>/dev/null || git subtree pull --prefix=vitrine https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/vitrine.git main --squash || true
      git subtree add --prefix=web https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/web.git main --squash 2>/dev/null || git subtree pull --prefix=web https://oauth2:$GITLAB_TOKEN@git.icarus-cyber.fr/icarus/web.git main --squash || true
    - git push origin main --force || true
  allow_failure: true
